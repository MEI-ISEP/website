<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title data-i18n="meta.coop">Cooperação · MEI · ISEP</title>
<meta name="description" data-i18n-attr="content:meta.coopDesc" content="">
<link rel="icon" href="favicon.ico" sizes="32x32">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="site.css">
</head>
<body data-page="cooperacao">

<div id="site-nav"></div>

<section class="subhero">
  <div class="subhero__hatch"></div>
  <div class="wrap subhero__inner">
    <div class="crumb"><a href="index.html" data-i18n="coop.crumbHome"></a><span>/</span><span data-i18n="coop.crumb"></span></div>
    <p class="eyebrow reveal in" data-i18n="coop.eyebrow"></p>
    <h1 class="reveal in" data-d="1" data-i18n="coop.h1"></h1>
    <p class="reveal in" id="coopIntro" data-d="2"></p>
  </div>
</section>

<!-- ============ FORMAS DE PARCERIA ============ -->
<section class="section" style="background:var(--soft-warm);">
  <div class="wrap">
    <p class="eyebrow reveal" data-i18n="coop.formsEyebrow"></p>
    <h2 class="h-lg reveal" data-i18n="coop.formsH2"></h2>
    <p class="lead reveal" id="coopFormsLead" style="margin-top:18px;"></p>
    <div class="coop-wall reveal" id="coopForms"></div>
    <div class="callout reveal" id="coopFormsNote"></div>
  </div>
</section>

<!-- ============ PROPOSTAS DE DISSERTAÇÃO ============ -->
<section class="section">
  <div class="wrap">
    <p class="eyebrow reveal" data-i18n="coop.proposalEyebrow"></p>
    <h2 class="h-lg reveal" data-i18n="coop.proposalH2"></h2>
    <p class="lead reveal" id="coopProposalLead" style="margin-top:18px;"></p>

    <p class="eyebrow muted reveal" style="margin-top:54px;" data-i18n="coop.processEyebrow"></p>
    <p class="body reveal" id="coopProcessLead" style="margin-top:14px;max-width:72ch;"></p>
    <div class="steps-list reveal" id="coopSteps"></div>
    <div class="callout reveal" id="coopProposalNote"></div>
  </div>
</section>

<!-- ============ O QUE FAZ UMA BOA PROPOSTA ============ -->
<section class="section" style="background:var(--soft);">
  <div class="wrap">
    <p class="eyebrow reveal" data-i18n="coop.goodEyebrow"></p>
    <h2 class="h-lg reveal" data-i18n="coop.goodH2"></h2>
    <p class="lead reveal" id="coopGoodLead" style="margin-top:18px;"></p>
    <div class="adm-two reveal" id="coopGood" style="margin-top:32px;"></div>
  </div>
</section>

<!-- ============ ASPETOS PRÁTICOS ============ -->
<section class="section">
  <div class="wrap">
    <p class="eyebrow reveal" data-i18n="coop.practicalEyebrow"></p>
    <h2 class="h-lg reveal" data-i18n="coop.practicalH2"></h2>
    <div class="sectors reveal" id="coopPractical" style="margin-top:36px;"></div>
  </div>
</section>

<!-- ============ CLOSING ============ -->
<section class="section closing">
  <div class="wrap">
    <p class="eyebrow reveal" data-i18n="coop.closingEyebrow"></p>
    <h2 class="h-lg reveal" style="color:#fff;" data-i18n="coop.closingH2"></h2>
    <p class="reveal" id="coopContactLead" style="margin-top:18px;max-width:66ch;color:rgba(255,255,255,.78);font-size:16px;line-height:1.6;"></p>
    <div class="closing__cta reveal" style="margin-top:32px;border-top:0;padding-top:0;">
      <div class="closing__actions" id="coopActions"></div>
    </div>
  </div>
</section>

<div id="site-footer"></div>

<script src="content.js"></script>
<script src="content.en.js"></script>
<script src="i18n.js"></script>
<script src="nav.js"></script>
<script src="reveal.js"></script>
<script src="cooperacao.js"></script>
</body>
</html>
